name: test

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install deps + build client bundle
        run: npm install --no-audit --no-fund && npm install react@^18 react-dom@^18 node-pty@^1 --no-save && node scripts/build-client.mjs
      - name: Run unit tests
        run: node test/unit.mjs
      - name: Run apply/execute mock tests
        run: node test/apply.mjs
      - name: Run buffer/delivery tests
        run: node test/buffer.mjs
      - name: Run terminal session tests (real node-pty)
        run: node test/terminal.mjs
      - name: Run settle-window and ssh session tests
        run: node test/settle.mjs
      - name: Run end-to-end shell tests (real spawns; skips when the DSH provider is absent)
        run: node test/e2e.mjs
      - name: Run client logic tests
        run: node test/client.mjs
